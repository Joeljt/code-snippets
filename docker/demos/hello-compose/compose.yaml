services:
  web:
    build: ../hello-dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      REDIS_HOST: redis          # 服务名 DNS，不是 localhost
      REDIS_PORT: "6379"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

volumes:
  redis-data:
